<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>Netheril</title>
  <style>
    @font-face {
      font-family: 'Cuneiform';
      src: url('/fonts/NotoSansCuneiform-Regular.ttf');
    }
    @font-face {
      font-family: 'Cinzel Decorative';
      font-weight: 700;
      font-display: swap;
      src: url('/fonts/CinzelDecorative-Bold.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Cinzel Decorative';
      font-weight: 900;
      font-display: swap;
      src: url('/fonts/CinzelDecorative-Black.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Cinzel';
      font-weight: 500;
      font-display: swap;
      src: url('/fonts/Cinzel-Regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'EbonSigil';
      font-display: swap;
      src: url('/fonts/EbonSigil.otf') format('opentype');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Cuneiform', sans-serif;
      user-select: none; -webkit-user-select: none;
      touch-action: none; -ms-touch-action: none;
    }

    body {
      --accent: 196,165,90;
      background:
        repeating-conic-gradient(rgba(0,0,0,0.02) 0% 25%, transparent 0% 50%) 0 0 / 4px 4px,
        radial-gradient(ellipse at 30% 20%, #c4a87a, transparent 60%),
        radial-gradient(ellipse at 70% 80%, #a08055, transparent 60%),
        linear-gradient(160deg, #b89968 0%, #a0824e 30%, #8b6f3c 60%, #a08050 100%);
      background-color: #9a7b4a;
    }
    body.color-white  { --accent: 240,240,235; }
    body.color-blue   { --accent: 79,195,247; }
    body.color-yellow { --accent: 255,213,79; }
    body.color-pink   { --accent: 244,143,177; }
    body.color-red    { --accent: 239,83,80; }
    body.color-orange { --accent: 255,167,38; }
    body.color-black  { --accent: 140,120,120; }
    body.color-green  { --accent: 129,199,132; }

    /* ===== Black cover / reveal ===== */
    @property --cover {
      syntax: '<percentage>';
      initial-value: 120%;
      inherits: false;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: #000;
      z-index: 999;
      pointer-events: none;
      --cover: 120%;
      -webkit-mask-image: radial-gradient(ellipse 135% 118% at 50% 50%, black var(--cover), transparent calc(var(--cover) + 20%));
      mask-image: radial-gradient(ellipse 135% 118% at 50% 50%, black var(--cover), transparent calc(var(--cover) + 20%));
      transition: --cover 2.8s cubic-bezier(0.4, 0, 0.15, 1);
    }
    body.active::after { --cover: -25%; }

    /* ===== Layout ===== */
    #app {
      width: 1920px; height: 1080px;
      display: flex;
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(var(--app-scale, 1));
    }
    .side-col {
      width: 384px; height: 1080px;
      display: flex; flex-direction: column;
      padding: 30px 0;
      transition: opacity 0.5s ease;
    }
    #left-col  .side-block { justify-content: flex-end;   padding-right: 36px; }
    #right-col .side-block { justify-content: flex-start; padding-left:  36px; }
    .side-block {
      flex: 1;
      display: flex; align-items: center;
      position: relative;
    }
    .side-block img {
      height: 92px; width: auto;
      opacity: 0.35;
      filter:
        drop-shadow(1px 1px 0 rgba(220,200,160,0.45))
        drop-shadow(-1px -1px 0 rgba(40,25,10,0.35));
      transition: opacity 0.6s ease, filter 0.6s ease, transform 0.4s ease;
    }
    body:not(.view-landing) .side-col {
      opacity: 0;
      pointer-events: none;
    }
    .side-block.active img {
      opacity: 1;
      filter:
        drop-shadow(1px 1px 0 rgba(220,200,160,0.6))
        drop-shadow(-1px -1px 0 rgba(40,25,10,0.5))
        drop-shadow(0 0 18px rgba(var(--accent),0.8))
        drop-shadow(0 0 38px rgba(var(--accent),0.5));
      animation: side-pulse 2.2s ease-in-out infinite;
    }
    @keyframes side-pulse {
      0%, 100% {
        opacity: 0.85;
        filter:
          drop-shadow(1px 1px 0 rgba(220,200,160,0.6))
          drop-shadow(-1px -1px 0 rgba(40,25,10,0.5))
          drop-shadow(0 0 12px rgba(var(--accent),0.55))
          drop-shadow(0 0 24px rgba(var(--accent),0.3));
      }
      50% {
        opacity: 1;
        filter:
          drop-shadow(1px 1px 0 rgba(220,200,160,0.6))
          drop-shadow(-1px -1px 0 rgba(40,25,10,0.5))
          drop-shadow(0 0 28px rgba(var(--accent),0.95))
          drop-shadow(0 0 58px rgba(var(--accent),0.6));
      }
    }
    .side-block.dim img { opacity: 0.18; }

    #center-col {
      width: 1152px; height: 1080px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }

    /* ===== Cross view (4 buttons + center school glyph) ===== */
    #cross-view {
      position: absolute; inset: 0;
      display: none;
      align-items: center; justify-content: center;
    }
    #cross-view.show { display: flex; }

    .cross-container {
      position: relative;
      width: 880px; height: 880px;
    }

    .cross-center {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 360px; height: 360px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 3px solid rgba(var(--accent),0.45);
      background: radial-gradient(circle, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.02) 100%);
      animation: cross-pulse 3s ease-in-out infinite;
      cursor: pointer;
    }
    .cross-center img {
      height: 230px; width: auto;
      filter:
        drop-shadow(1px 1px 0 rgba(220,200,160,0.6))
        drop-shadow(-1px -1px 0 rgba(40,25,10,0.5))
        drop-shadow(0 0 22px rgba(var(--accent),0.7));
    }
    .cross-center::after {
      content: attr(data-game-label);
      position: absolute;
      bottom: 30px;
      font-family: 'Cinzel Decorative', serif;
      font-size: 20px;
      width: 310px;
      line-height: 1.15;
      color: rgba(50,32,12,0.9);
      text-shadow: 0 0 12px rgba(var(--accent),0.7);
    }
    .cross-center:active { transform: translate(-50%, -50%) scale(0.95); }
    .cross-center.completed {
      cursor: default;
      opacity: 0.45;
      animation: none;
    }
    .cross-center.completed::after { content: 'CLAIMED'; }
    .cross-center.planned {
      cursor: default;
      opacity: 0.72;
      animation: none;
    }
    @keyframes cross-pulse {
      0%, 100% { border-color: rgba(var(--accent),0.35); box-shadow: 0 0 30px rgba(var(--accent),0.15); }
      50%      { border-color: rgba(var(--accent),0.75); box-shadow: 0 0 60px rgba(var(--accent),0.4); }
    }

    .cross-btn {
      position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(var(--accent),0.35);
      background: radial-gradient(circle, rgba(0,0,0,0.06) 0%, transparent 100%);
      cursor: pointer;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
    }
    .cross-btn .glyph {
      font-family: 'Cuneiform', sans-serif;
      font-size: 110px; line-height: 1;
      color: rgba(60,42,20,0.9);
      text-shadow:
        1px 1px 0 rgba(220,200,160,0.6),
        -1px -1px 0 rgba(40,25,10,0.4),
        0 0 14px rgba(var(--accent),0.5);
    }
    .cross-btn:hover, .cross-btn.active {
      border-color: rgba(var(--accent),0.85);
      box-shadow: 0 0 40px rgba(var(--accent),0.4);
    }

    .cross-btn-top    { left: 50%; top: 0;    transform: translate(-50%, 0); }
    .cross-btn-right  { right: 0;  top: 50%;  transform: translate(0, -50%); }
    .cross-btn-bottom { left: 50%; bottom: 0; transform: translate(-50%, 0); }
    .cross-btn-left   { left: 0;   top: 50%;  transform: translate(0, -50%); }
    .cross-btn-top:active    { transform: translate(-50%, 0) scale(0.93); }
    .cross-btn-right:active  { transform: translate(0, -50%) scale(0.93); }
    .cross-btn-bottom:active { transform: translate(-50%, 0) scale(0.93); }
    .cross-btn-left:active   { transform: translate(0, -50%) scale(0.93); }

    /* ===== Page view (rendered markdown) ===== */
    #page-view {
      position: absolute; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px;
    }
    #page-view.show { display: flex; }

    /* ===== Crystal games ===== */
    #game-view {
      position: absolute; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      padding: 36px;
    }
    #game-view.show { display: flex; }
    .game-header {
      width: 820px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 22px;
      color: rgba(50,32,12,0.96);
    }
    .game-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 42px;
      text-align: center;
      text-shadow: 0 0 18px rgba(var(--accent),0.5);
    }
    .game-stat {
      font-family: 'Cinzel', serif;
      font-size: 24px;
    }
    #game-progress { text-align: right; }
    #game-fails.danger { color: #9f1d20; text-shadow: 0 0 12px rgba(159,29,32,0.45); }
    #game-board {
      width: 860px;
      min-height: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    #game-board.mode-glyph {
      display: grid;
      grid-template-columns: repeat(4, 180px);
      grid-template-rows: repeat(4, 180px);
      gap: 18px;
      width: 774px;
      height: 774px;
    }
    .game-prompt {
      max-width: 820px;
      font-family: 'Cinzel', serif;
      font-size: 28px;
      line-height: 1.4;
      text-align: center;
      color: rgba(50,32,12,0.92);
    }
    .game-options {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .game-choice {
      min-height: 120px;
      padding: 18px 22px;
      border: 2px solid rgba(var(--accent),0.45);
      border-radius: 6px;
      background: rgba(0,0,0,0.07);
      color: rgba(50,32,12,0.96);
      font-family: 'Cinzel', serif;
      font-size: 25px;
      line-height: 1.3;
      cursor: pointer;
    }
    .game-choice:active { transform: scale(0.97); }
    .game-choice.selected,
    .game-choice.correct { border-color: rgba(var(--accent),0.95); box-shadow: 0 0 24px rgba(var(--accent),0.42); }
    .game-choice.wrong { border-color: #9f1d20; opacity: 0.55; }
    .rune-row, .simon-row, .ingredient-row, .letter-grid {
      width: 100%;
      display: grid;
      gap: 16px;
    }
    .rune-row { grid-template-columns: repeat(6, 1fr); }
    .simon-row { grid-template-columns: repeat(4, 1fr); }
    .ingredient-row { grid-template-columns: repeat(3, 1fr); }
    #game-board.mode-potion .game-prompt { font-size: 23px; white-space: pre-line; }
    #game-board.mode-potion .ingredient-row { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    #game-board.mode-potion .ingredient-key { min-height: 88px; padding: 8px; font-size: 20px; }
    .potion-actions { display: flex; gap: 16px; }
    .letter-grid { grid-template-columns: repeat(7, 1fr); gap: 10px; }
    .rune-key, .simon-key, .ingredient-key, .letter-key {
      min-height: 105px;
      border: 2px solid rgba(var(--accent),0.45);
      border-radius: 6px;
      background: rgba(0,0,0,0.07);
      color: rgba(50,32,12,0.95);
      font-family: 'Cinzel', serif;
      font-size: 28px;
      cursor: pointer;
    }
    .rune-key { font-family: 'Cuneiform', sans-serif; font-size: 62px; }
    .simon-key { height: 180px; font-family: 'Cuneiform', sans-serif; font-size: 76px; }
    .simon-key.lit { background: rgba(var(--accent),0.72); box-shadow: 0 0 42px rgba(var(--accent),0.8); }
    .ingredient-key.selected { background: rgba(var(--accent),0.28); }
    .letter-key { min-height: 64px; font-size: 22px; }
    .letter-key:disabled { opacity: 0.3; }
    .phrase-display {
      font-family: 'Cinzel Decorative', serif;
      font-size: 48px;
      letter-spacing: 0;
      word-spacing: 18px;
      text-align: center;
      color: rgba(50,32,12,0.98);
    }
    .ring-row { display: flex; align-items: center; justify-content: center; gap: 34px; }
    .weave-ring {
      width: 180px; height: 180px;
      border-radius: 50%;
      border: 4px solid rgba(var(--accent),0.65);
      background: rgba(0,0,0,0.06);
      font-family: 'Cuneiform', sans-serif;
      font-size: 90px;
      color: rgba(50,32,12,0.92);
      cursor: pointer;
      transition: transform 0.25s;
    }
    .game-command {
      min-width: 240px;
      padding: 16px 28px;
      border: 2px solid rgba(var(--accent),0.65);
      border-radius: 6px;
      background: rgba(var(--accent),0.16);
      color: rgba(50,32,12,0.96);
      font-family: 'Cinzel Decorative', serif;
      font-size: 24px;
      cursor: pointer;
    }
    .monster-shadow {
      font-size: 210px;
      line-height: 1;
      filter: grayscale(1) brightness(0.16) drop-shadow(0 0 28px rgba(var(--accent),0.6));
    }
    .recipe-slots { min-height: 64px; font-family: 'Cinzel', serif; font-size: 28px; text-align: center; }
    .glyph-card {
      position: relative;
      width: 180px; height: 180px;
      border: 2px solid rgba(var(--accent),0.45);
      border-radius: 6px;
      background: radial-gradient(circle, rgba(var(--accent),0.16), rgba(40,25,10,0.08));
      cursor: pointer;
      overflow: hidden;
      box-shadow: inset 0 0 22px rgba(40,25,10,0.16);
    }
    .glyph-card::before {
      content: '\12313';
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cuneiform', sans-serif;
      font-size: 92px;
      color: rgba(60,42,20,0.72);
      text-shadow: 0 0 18px rgba(var(--accent),0.5);
      transition: opacity 0.2s;
    }
    .glyph-card img {
      position: absolute;
      width: 124px; height: 124px;
      left: 28px; top: 28px;
      object-fit: contain;
      opacity: 0;
      transform: scale(0.72);
      transition: opacity 0.2s, transform 0.2s;
      filter: drop-shadow(0 0 16px rgba(var(--accent),0.65));
    }
    .glyph-card.revealed::before,
    .glyph-card.matched::before { opacity: 0; }
    .glyph-card.revealed img,
    .glyph-card.matched img { opacity: 1; transform: scale(1); }
    .glyph-card.matched {
      border-color: rgba(var(--accent),0.9);
      box-shadow: 0 0 22px rgba(var(--accent),0.45), inset 0 0 22px rgba(var(--accent),0.18);
    }
    .game-action {
      position: absolute;
      top: 24px;
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 2px solid rgba(var(--accent),0.4);
      background: rgba(0,0,0,0.12);
      color: rgba(60,42,20,0.9);
      font-family: 'Cuneiform', sans-serif;
      font-size: 38px;
      cursor: pointer;
    }
    #game-close { right: 24px; }
    #game-result {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center; justify-content: center;
      flex-direction: column;
      background: rgba(160,128,78,0.94);
      z-index: 4;
      text-align: center;
    }
    #game-result.show { display: flex; }
    #game-result h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 62px;
      color: rgba(50,32,12,0.98);
      text-shadow: 0 0 24px rgba(var(--accent),0.7);
    }
    #game-result p {
      margin-top: 18px;
      font-family: 'Cinzel', serif;
      font-size: 30px;
      color: rgba(50,32,12,0.92);
    }
    #game-result button {
      margin-top: 32px;
      padding: 16px 34px;
      border: 2px solid rgba(var(--accent),0.65);
      border-radius: 6px;
      background: rgba(0,0,0,0.1);
      font-family: 'Cinzel Decorative', serif;
      font-size: 24px;
      color: rgba(50,32,12,0.95);
      cursor: pointer;
    }

    /* ===== Prize page ===== */
    #prize-view {
      position: absolute; inset: 0;
      display: none;
      align-items: center; justify-content: center;
      flex-direction: column;
      padding: 90px;
      text-align: center;
    }
    #prize-view.show { display: flex; }
    .prize-sigil {
      width: 240px; height: 240px;
      display: flex; align-items: center; justify-content: center;
      border: 3px solid rgba(var(--accent),0.7);
      border-radius: 50%;
      font-family: 'Cuneiform', sans-serif;
      font-size: 140px;
      color: rgba(60,42,20,0.94);
      box-shadow: 0 0 65px rgba(var(--accent),0.5), inset 0 0 40px rgba(var(--accent),0.2);
      animation: cross-pulse 2.4s ease-in-out infinite;
    }
    #prize-title {
      margin-top: 42px;
      max-width: 1000px;
      font-family: 'Cinzel Decorative', serif;
      font-size: 68px;
      line-height: 1.15;
      color: rgba(50,32,12,0.98);
      text-shadow: 0 0 28px rgba(var(--accent),0.7);
    }
    #prize-description {
      margin-top: 24px;
      max-width: 900px;
      font-family: 'Cinzel', serif;
      font-size: 32px;
      line-height: 1.45;
      color: rgba(50,32,12,0.92);
    }
    .prize-instruction {
      margin-top: 44px;
      font-family: 'Cinzel Decorative', serif;
      font-size: 22px;
      color: rgba(60,42,20,0.72);
    }

    /* ===== Landing view: 2x4 grid of school symbols ===== */
    #landing-view {
      position: absolute; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      padding: 30px 20px;
    }
    #landing-view.show { display: flex; }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(4, 220px);
      grid-template-rows: repeat(2, 220px);
      gap: 30px 30px;
      margin-bottom: 38px;
    }
    .preview-cell {
      position: relative;
      width: 220px; height: 220px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      border: 2px solid rgba(60,42,20,0.35);
      background: radial-gradient(circle, rgba(0,0,0,0.10) 0%, transparent 75%);
    }
    /* Color halo behind each symbol — uses the crystal's color */
    .preview-cell::before {
      content: '';
      position: absolute; inset: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--cell-accent),0.55) 0%, rgba(var(--cell-accent),0.18) 45%, transparent 75%);
      filter: blur(6px);
      animation: cell-pulse 3.4s ease-in-out infinite;
    }
    .preview-cell img {
      position: relative;
      height: 150px; width: auto;
      filter:
        drop-shadow(1px 1px 0 rgba(220,200,160,0.55))
        drop-shadow(-1px -1px 0 rgba(40,25,10,0.45))
        drop-shadow(0 0 14px rgba(var(--cell-accent),0.7));
    }
    @keyframes cell-pulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }
    /* Per-cell crystal-color overrides */
    .preview-cell[data-color="white"]  { --cell-accent: 240,240,235; }
    .preview-cell[data-color="blue"]   { --cell-accent: 79,195,247; }
    .preview-cell[data-color="yellow"] { --cell-accent: 255,213,79; }
    .preview-cell[data-color="pink"]   { --cell-accent: 244,143,177; }
    .preview-cell[data-color="red"]    { --cell-accent: 239,83,80; }
    .preview-cell[data-color="orange"] { --cell-accent: 255,167,38; }
    .preview-cell[data-color="black"]  { --cell-accent: 80,70,70; }
    .preview-cell[data-color="green"]  { --cell-accent: 129,199,132; }

    .preview-message {
      font-family: 'EbonSigil', 'Cinzel Decorative', 'Cinzel', serif;
      font-weight: 700;
      font-size: 56px;
      line-height: 1.25;
      text-align: center;
      max-width: 1050px;
      color: rgba(50,32,12,0.96);
      letter-spacing: 0.02em;
      text-shadow:
        2px 2px 0 rgba(230,210,170,0.55),
        -1px -1px 0 rgba(40,25,10,0.5),
        0 0 22px rgba(var(--accent),0.45);
    }

    #page-scroll {
      width: 100%; max-width: 1040px;
      height: 100%; max-height: 940px;
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 38px 46px;
      background: transparent;
      border: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(60,42,20,0.25) transparent;
      /* fade top/bottom into the parchment background */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
    }
    #page-scroll::-webkit-scrollbar { width: 6px; }
    #page-scroll::-webkit-scrollbar-thumb { background: rgba(60,42,20,0.25); border-radius: 3px; }
    #page-content {
      font-family: 'Cinzel', 'Cinzel Decorative', serif;
      font-size: 28px;
      color: rgba(40,28,12,0.92);
      text-shadow:
        1px 1px 0 rgba(220,200,160,0.4),
        -1px -1px 0 rgba(40,25,10,0.3);
    }
    #page-content h1 {
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      font-size: 64px; line-height: 1.1;
      margin-bottom: 16px;
      letter-spacing: 0.02em;
      color: rgba(60,42,20,1);
      text-shadow:
        2px 2px 0 rgba(230,210,170,0.6),
        -2px -2px 0 rgba(40,25,10,0.5),
        0 0 22px rgba(var(--accent),0.55);
    }
    #page-content h2 { font-family: 'Cinzel Decorative', serif; font-weight: 700; font-size: 42px; margin: 26px 0 12px; letter-spacing: 0.02em; }
    #page-content h3 { font-family: 'Cinzel Decorative', serif; font-weight: 700; font-size: 32px; margin: 20px 0 10px; letter-spacing: 0.02em; }
    #page-content p  { font-size: 28px; line-height: 1.5; margin-bottom: 18px; }
    #page-content em { color: rgba(80,55,25,0.85); font-style: italic; }
    #page-content strong { color: rgba(60,42,20,1); }
    #page-content ul, #page-content ol { margin: 12px 0 18px 36px; font-size: 26px; line-height: 1.5; }
    #page-content li { margin-bottom: 8px; }
    #page-content code {
      font-family: monospace; font-size: 22px;
      background: rgba(0,0,0,0.08); padding: 2px 6px; border-radius: 3px;
    }

    #page-close {
      position: absolute; top: 24px; right: 24px;
      width: 72px; height: 72px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(var(--accent),0.4);
      background: rgba(0,0,0,0.15);
      cursor: pointer;
      color: rgba(60,42,20,0.9);
      font-family: 'Cuneiform', sans-serif;
      font-size: 44px; line-height: 1;
      z-index: 5;
    }
    #page-close:hover { border-color: rgba(var(--accent),0.85); box-shadow: 0 0 24px rgba(var(--accent),0.35); }
    #page-close:active { transform: scale(0.92); }

    /* ===== Misc ===== */
    #exit-btn {
      position: fixed; top: 8px; right: 12px;
      font-family: 'Cuneiform', sans-serif; font-size: 0.8rem;
      color: rgba(60,42,20,0.3); background: none; border: none;
      cursor: pointer; padding: 6px 10px; z-index: 100;
    }
    #exit-btn:active { color: #ef5350; }

    @keyframes fade-in {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1); }
    }
    .fade-in { animation: fade-in 0.6s ease forwards; }
  </style>
</head>
<body>
  <button id="exit-btn">[EXIT]</button>

  <div id="app">
    <!-- LEFT: 4 school icons -->
    <div class="side-col" id="left-col">
      <div class="side-block" data-school="abjuration"><img src="/img/schools/abjuration.png" alt="abjuration"></div>
      <div class="side-block" data-school="conjuration"><img src="/img/schools/conjuration.png" alt="conjuration"></div>
      <div class="side-block" data-school="divination"><img src="/img/schools/divination.png" alt="divination"></div>
      <div class="side-block" data-school="enchantment"><img src="/img/schools/enchantment.png" alt="enchantment"></div>
    </div>

    <!-- CENTER: landing view / crystal menu / page view -->
    <div id="center-col">
      <div id="cross-view">
        <div class="cross-container">
          <button class="cross-center" id="game-launch" title="Glyph Matching"><img id="cross-center-img" src="" alt=""></button>
          <div class="cross-btn cross-btn-top"    data-loc="top"><span class="glyph">&#x12313;</span></div>
          <div class="cross-btn cross-btn-right"  data-loc="right"><span class="glyph">&#x122D7;</span></div>
          <div class="cross-btn cross-btn-bottom" data-loc="bottom"><span class="glyph">&#x121B3;</span></div>
          <div class="cross-btn cross-btn-left"   data-loc="left"><span class="glyph">&#x12146;</span></div>
        </div>
      </div>

      <div id="landing-view">
        <div class="preview-grid">
          <div class="preview-cell" data-color="white"><img src="/img/schools/abjuration.png"    alt="abjuration"></div>
          <div class="preview-cell" data-color="blue"><img src="/img/schools/conjuration.png"   alt="conjuration"></div>
          <div class="preview-cell" data-color="yellow"><img src="/img/schools/divination.png"  alt="divination"></div>
          <div class="preview-cell" data-color="pink"><img src="/img/schools/enchantment.png"   alt="enchantment"></div>
          <div class="preview-cell" data-color="red"><img src="/img/schools/evocation.png"      alt="evocation"></div>
          <div class="preview-cell" data-color="orange"><img src="/img/schools/illusion.png"    alt="illusion"></div>
          <div class="preview-cell" data-color="black"><img src="/img/schools/necromancy.png"   alt="necromancy"></div>
          <div class="preview-cell" data-color="green"><img src="/img/schools/transmutation.png" alt="transmutation"></div>
        </div>
        <div class="preview-message">Seek the crystals to unlock the treasures, clues, and dangers.</div>
      </div>

      <div id="page-view">
        <button id="page-close" title="close">&#x12471;</button>
        <div id="page-scroll">
          <div id="page-content"></div>
        </div>
      </div>

      <div id="game-view">
        <button class="game-action" id="game-close" title="Close">&#x12471;</button>
        <div class="game-header">
          <div class="game-stat" id="game-fails">Fails: 0 / 5</div>
          <div class="game-title" id="game-title">Glyph Matching</div>
          <div class="game-stat" id="game-progress">Pairs: 0 / 8</div>
        </div>
        <div id="game-board"></div>
        <div id="game-result">
          <h2 id="game-result-title"></h2>
          <p id="game-result-text"></p>
          <button id="game-result-action">Return to Crystal</button>
        </div>
      </div>

      <div id="prize-view">
        <div class="prize-sigil">&#x12313;</div>
        <h1 id="prize-title"></h1>
        <p id="prize-description"></p>
        <div class="prize-instruction">Present this page to the Game Master. Remove the crystal when the prize is claimed.</div>
      </div>
    </div>

    <!-- RIGHT: 4 school icons -->
    <div class="side-col" id="right-col">
      <div class="side-block" data-school="evocation"><img src="/img/schools/evocation.png" alt="evocation"></div>
      <div class="side-block" data-school="illusion"><img src="/img/schools/illusion.png" alt="illusion"></div>
      <div class="side-block" data-school="necromancy"><img src="/img/schools/necromancy.png" alt="necromancy"></div>
      <div class="side-block" data-school="transmutation"><img src="/img/schools/transmutation.png" alt="transmutation"></div>
    </div>
  </div>

  <script>
    // ===== Elements =====
    const crossView      = document.getElementById('cross-view');
    const crossCenterImg = document.getElementById('cross-center-img');
    const pageView       = document.getElementById('page-view');
    const pageContent    = document.getElementById('page-content');
    const pageScroll     = document.getElementById('page-scroll');
    const pageClose      = document.getElementById('page-close');
    const landingView    = document.getElementById('landing-view');
    const gameView       = document.getElementById('game-view');
    const gameBoard      = document.getElementById('game-board');
    const gameResult     = document.getElementById('game-result');
    const prizeView      = document.getElementById('prize-view');
    const sideBlocks     = document.querySelectorAll('.side-block');

    const COLOR_CLASSES = ['color-white','color-blue','color-yellow','color-pink','color-red','color-orange','color-black','color-green'];

    function fitAppToViewport() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      document.getElementById('app').style.setProperty('--app-scale', scale);
    }
    window.addEventListener('resize', fitAppToViewport);
    fitAppToViewport();

    // ===== State =====
    let crystalActive = false;
    let currentSchool = null;
    let currentColor  = null;
    let currentView   = 'landing';
    let currentInsertionId = null;
    let currentGameId = null;
    let gameFails = 0;
    let gameLocked = false;
    let gameTimers = [];
    let gameCleanup = null;
    let gameCompleted = false;

    const GAME_SCHOOLS = ['abjuration','conjuration','divination','enchantment','evocation','illusion','necromancy','transmutation'];
    const SCHOOL_GAMES = {
      abjuration:    { id: 'trap-disarmament', name: 'Trap Disarmament', start: startTrapGame },
      conjuration:   { id: 'weave-lock', name: 'Weave Lock', start: startWeaveGame },
      divination:    { id: 'wheel-of-fate', name: 'Wheel of Fate', start: startWheelGame },
      enchantment:   { id: 'lying-statues', name: 'The Lying Statues', start: startStatuesGame },
      evocation:     { id: 'runic-sequence', name: 'Runic Sequence', start: startSequenceGame },
      illusion:      { id: 'glyph-matching', name: 'Glyph Matching', start: startGlyphGame },
      necromancy:    { id: 'monster-silhouette', name: 'Monster Silhouette', start: startMonsterGame },
      transmutation: { id: 'potion-mixing', name: 'Potion Mixing', start: startPotionGame },
    };

    // ===== Audio cues =====
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    document.addEventListener('touchstart', () => { if (audioCtx.state==='suspended') audioCtx.resume(); }, { once: true });
    document.addEventListener('click',      () => { if (audioCtx.state==='suspended') audioCtx.resume(); }, { once: true });

    function playCrystalChime() {
      const now = audioCtx.currentTime;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.18, now); gain.gain.exponentialRampToValueAtTime(0.001, now+1.1);
      gain.connect(audioCtx.destination);
      [523,659,784].forEach((f,i) => {
        const o = audioCtx.createOscillator();
        o.type = 'triangle'; o.frequency.value = f; o.connect(gain);
        o.start(now+i*0.08); o.stop(now+1.1);
      });
    }
    function playOrbSelect() {
      const now = audioCtx.currentTime;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.55);
      gain.connect(audioCtx.destination);
      const o = audioCtx.createOscillator();
      o.type='sine'; o.frequency.value=440;
      o.frequency.exponentialRampToValueAtTime(880, now+0.3);
      o.connect(gain); o.start(now); o.stop(now+0.55);
    }

    // ===== View transitions =====
    const VIEW_CLASSES = ['view-landing','view-cross','view-page','view-game','view-prize'];
    function setViewClass(view) {
      VIEW_CLASSES.forEach(c => document.body.classList.remove(c));
      document.body.classList.add('view-' + view);
    }

    function hideAllViews() {
      crossView.classList.remove('show');
      pageView.classList.remove('show');
      landingView.classList.remove('show');
      gameView.classList.remove('show');
      prizeView.classList.remove('show');
    }

    function showLandingView() {
      hideAllViews();
      currentView = 'landing';
      setViewClass('landing');
      landingView.classList.add('show', 'fade-in');
      clearSchoolHighlight();
    }

    function showCrossView() {
      hideAllViews();
      currentView = 'cross';
      setViewClass('cross');
      if (currentSchool) {
        crossCenterImg.src = '/img/schools/' + currentSchool + '.png';
      }
      const game = SCHOOL_GAMES[currentSchool];
      const gameLaunch = document.getElementById('game-launch');
      gameLaunch.dataset.gameLabel = game ? game.name : 'No Trial';
      gameLaunch.title = game ? game.name : 'No trial assigned';
      gameLaunch.disabled = gameCompleted || !game;
      gameLaunch.classList.toggle('completed', gameCompleted);
      gameLaunch.classList.toggle('planned', !gameCompleted && !game);
      crossView.classList.add('show', 'fade-in');
      highlightSchool(currentSchool);
    }

    function showPageView(html) {
      hideAllViews();
      currentView = 'page';
      setViewClass('page');
      pageContent.innerHTML = html;
      pageScroll.scrollTop = 0;
      pageView.classList.add('show', 'fade-in');
    }

    function shuffle(values) {
      for (let index = values.length - 1; index > 0; index--) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [values[index], values[swapIndex]] = [values[swapIndex], values[index]];
      }
      return values;
    }

    function clearGameTimers() {
      gameTimers.forEach(timer => clearTimeout(timer));
      gameTimers = [];
    }

    function scheduleGame(action, delay) {
      const timer = setTimeout(action, delay);
      gameTimers.push(timer);
      return timer;
    }

    function cleanupActiveGame() {
      clearGameTimers();
      if (gameCleanup) gameCleanup();
      gameCleanup = null;
      gameLocked = false;
      gameBoard.innerHTML = '';
      gameBoard.className = '';
    }

    function updateFails() {
      const fails = document.getElementById('game-fails');
      fails.textContent = 'Fails: ' + gameFails + ' / 5';
      fails.classList.toggle('danger', gameFails >= 3);
    }

    function setGameProgress(text) {
      document.getElementById('game-progress').textContent = text;
    }

    function prepareGame(game, progress) {
      cleanupActiveGame();
      gameFails = 0;
      currentGameId = game.id;
      document.getElementById('game-title').textContent = game.name;
      setGameProgress(progress);
      updateFails();
      gameResult.classList.remove('show');
      hideAllViews();
      currentView = 'game';
      setViewClass('game');
      gameView.classList.add('show', 'fade-in');
    }

    function recordCorrect() {
      gameFails = Math.max(0, gameFails - 1);
      updateFails();
    }

    function recordFailure() {
      if (gameLocked) return false;
      gameFails = Math.min(5, gameFails + 1);
      updateFails();
      if (gameFails >= 5) {
        showGameOver();
        return false;
      }
      return true;
    }

    function showGameOver() {
      gameLocked = true;
      clearGameTimers();
      gameBoard.querySelectorAll('button').forEach(button => { button.disabled = true; });
      document.getElementById('game-result-title').textContent = 'The Weave Rejects You';
      document.getElementById('game-result-text').textContent = 'Five failures have broken the pattern. The trial is over.';
      gameResult.classList.add('show');
    }

    function showPrizePage(prize) {
      hideAllViews();
      currentView = 'prize';
      setViewClass('prize');
      document.getElementById('prize-title').textContent = prize.enabled ? prize.title : 'Victory Recorded';
      document.getElementById('prize-description').textContent = prize.enabled
        ? prize.description
        : 'No physical prize is currently enabled. Consult the Game Master.';
      prizeView.classList.add('show', 'fade-in');
    }

    async function completeActiveGame() {
      gameLocked = true;
      clearGameTimers();
      gameBoard.querySelectorAll('button').forEach(button => { button.disabled = true; });
      try {
        const response = await fetch('/api/games/' + currentGameId + '/complete', {
          method: 'POST',
          headers: { 'X-Netheril-Insertion': currentInsertionId || '' },
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Prize could not be claimed.');
        gameCompleted = true;
        showPrizePage(data.prize);
      } catch (error) {
        document.getElementById('game-result-title').textContent = 'The Vault Is Sealed';
        document.getElementById('game-result-text').textContent = error.message;
        gameResult.classList.add('show');
      }
    }

    function addPrompt(text) {
      const prompt = document.createElement('div');
      prompt.className = 'game-prompt';
      prompt.textContent = text;
      gameBoard.appendChild(prompt);
      return prompt;
    }

    function addChoice(label, action, className = 'game-choice') {
      const button = document.createElement('button');
      button.className = className;
      button.textContent = label;
      button.addEventListener('click', () => {
        if (!gameLocked) action(button);
      });
      return button;
    }

    function startSchoolGame() {
      const game = SCHOOL_GAMES[currentSchool];
      if (!game || gameCompleted) return;
      game.start(game);
    }

    function startGlyphGame(game) {
      prepareGame(game, 'Pairs: 0 / 8');
      gameBoard.className = 'mode-glyph';
      const deck = shuffle([...GAME_SCHOOLS, ...GAME_SCHOOLS]);
      let revealed = [];
      let matches = 0;
      deck.forEach(school => {
        const card = document.createElement('button');
        card.className = 'glyph-card';
        card.dataset.school = school;
        card.setAttribute('aria-label', 'Hidden glyph');
        const image = document.createElement('img');
        image.src = '/img/schools/' + school + '.png';
        image.alt = school;
        card.appendChild(image);
        card.addEventListener('click', () => {
          if (gameLocked || card.classList.contains('revealed') || card.classList.contains('matched')) return;
          playOrbSelect();
          card.classList.add('revealed');
          revealed.push(card);
          if (revealed.length < 2) return;
          const [first, second] = revealed;
          if (first.dataset.school === second.dataset.school) {
            first.classList.add('matched'); second.classList.add('matched');
            first.disabled = true; second.disabled = true;
            revealed = []; matches++; recordCorrect();
            setGameProgress('Pairs: ' + matches + ' / 8');
            if (matches === 8) scheduleGame(completeActiveGame, 350);
          } else {
            if (!recordFailure()) return;
            gameLocked = true;
            scheduleGame(() => {
              first.classList.remove('revealed'); second.classList.remove('revealed');
              revealed = []; gameLocked = false;
            }, 700);
          }
        });
        gameBoard.appendChild(card);
      });
    }

    function startTrapGame(game) {
      prepareGame(game, 'Wards: 0 / 3');
      const glyphs = [0x1202D, 0x12038, 0x12146, 0x121B3, 0x122D7, 0x12313].map(code => String.fromCodePoint(code));
      const wards = [[0,2,4], [5,1,3,0], [2,5,4,1,3]];
      let round = 0, step = 0;
      function renderWard() {
        gameBoard.innerHTML = '';
        addPrompt('Memorize and touch the safe runes in order: ' + wards[round].map(index => glyphs[index]).join('  '));
        const row = document.createElement('div'); row.className = 'rune-row';
        glyphs.forEach((glyph, index) => row.appendChild(addChoice(glyph, button => {
          if (index !== wards[round][step]) {
            button.classList.add('wrong'); recordFailure(); step = 0; return;
          }
          button.classList.add('correct'); recordCorrect(); step++;
          if (step === wards[round].length) {
            round++; setGameProgress('Wards: ' + round + ' / 3');
            if (round === wards.length) scheduleGame(completeActiveGame, 350);
            else { step = 0; scheduleGame(renderWard, 400); }
          }
        }, 'rune-key')));
        gameBoard.appendChild(row);
      }
      renderWard();
    }

    function startWeaveGame(game) {
      prepareGame(game, 'Locks: 0 / 3');
      const targets = [[1,2,3], [3,1,2], [2,3,1]];
      let round = 0;
      function renderLock() {
        gameBoard.innerHTML = '';
        const target = targets[round];
        addPrompt('Align the three planar rings to ' + target.map(value => value * 90 + '°').join(', ') + '. Tap a ring to rotate it.');
        const values = [0,0,0];
        const row = document.createElement('div'); row.className = 'ring-row';
        values.forEach((_value, index) => {
          const ring = addChoice(String.fromCodePoint(0x12313), button => {
            values[index] = (values[index] + 1) % 4;
            button.style.transform = 'rotate(' + values[index] * 90 + 'deg)';
          }, 'weave-ring');
          row.appendChild(ring);
        });
        gameBoard.appendChild(row);
        gameBoard.appendChild(addChoice('Open the Portal', () => {
          if (!values.every((value, index) => value === target[index])) { recordFailure(); return; }
          recordCorrect(); round++; setGameProgress('Locks: ' + round + ' / 3');
          if (round === targets.length) scheduleGame(completeActiveGame, 350); else renderLock();
        }, 'game-command'));
      }
      renderLock();
    }

    function startWheelGame(game) {
      prepareGame(game, 'Letters: 0');
      const phrases = ['THE WEAVE', 'HIDDEN DOOR', 'ARCANE EYE'];
      const phrase = phrases[Math.floor(Math.random() * phrases.length)];
      const guessed = new Set();
      const display = document.createElement('div'); display.className = 'phrase-display';
      addPrompt('Reveal the phrase of fate. An absent letter adds one failure.');
      gameBoard.appendChild(display);
      const grid = document.createElement('div'); grid.className = 'letter-grid'; gameBoard.appendChild(grid);
      function refresh() {
        display.textContent = [...phrase].map(char => char === ' ' ? '   ' : guessed.has(char) ? char : '_').join(' ');
        const revealed = [...phrase].filter(char => char !== ' ' && guessed.has(char)).length;
        setGameProgress('Letters: ' + revealed);
        if ([...phrase].every(char => char === ' ' || guessed.has(char))) scheduleGame(completeActiveGame, 350);
      }
      'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(letter => grid.appendChild(addChoice(letter, button => {
        guessed.add(letter); button.disabled = true;
        if (phrase.includes(letter)) recordCorrect(); else recordFailure();
        refresh();
      }, 'letter-key')));
      refresh();
    }

    function startStatuesGame(game) {
      prepareGame(game, 'Judgments: 0 / 3');
      const scenes = [
        { prompt: 'Exactly one statue lies. Which one?', liar: 1, lines: ['The left door is safe.', 'The right door is safe.', 'The left door is safe.'] },
        { prompt: 'Exactly one statue lies. Which one?', liar: 2, lines: ['The key is not beneath me.', 'The key is not beneath me.', 'The key is beneath me.'] },
        { prompt: 'Exactly one statue lies. Which one?', liar: 0, lines: ['The red rune is harmless.', 'The red rune is trapped.', 'The red rune is trapped.'] },
      ];
      let round = 0;
      function renderScene() {
        gameBoard.innerHTML = ''; addPrompt(scenes[round].prompt);
        const options = document.createElement('div'); options.className = 'game-options';
        scenes[round].lines.forEach((line, index) => options.appendChild(addChoice('Statue ' + (index + 1) + ': “' + line + '”', button => {
          if (index !== scenes[round].liar) { button.classList.add('wrong'); button.disabled = true; recordFailure(); return; }
          button.classList.add('correct'); recordCorrect(); round++; setGameProgress('Judgments: ' + round + ' / 3');
          if (round === scenes.length) scheduleGame(completeActiveGame, 350); else scheduleGame(renderScene, 350);
        })));
        gameBoard.appendChild(options);
      }
      renderScene();
    }

    function startSequenceGame(game) {
      prepareGame(game, 'Rounds: 0 / 5');
      addPrompt('Watch the runes flare, then repeat the sequence.');
      const row = document.createElement('div'); row.className = 'simon-row'; gameBoard.appendChild(row);
      const keys = [0x1202D,0x12146,0x122D7,0x12313].map((code, index) => addChoice(String.fromCodePoint(code), () => press(index), 'simon-key'));
      keys.forEach(key => row.appendChild(key));
      let sequence = [Math.floor(Math.random() * 4)], input = [], round = 0;
      function play() {
        gameLocked = true; input = [];
        sequence.forEach((value, index) => {
          scheduleGame(() => keys[value].classList.add('lit'), 300 + index * 520);
          scheduleGame(() => keys[value].classList.remove('lit'), 620 + index * 520);
        });
        scheduleGame(() => { gameLocked = false; }, 720 + sequence.length * 520);
      }
      function press(index) {
        keys[index].classList.add('lit'); scheduleGame(() => keys[index].classList.remove('lit'), 180);
        if (index !== sequence[input.length]) {
          input = []; if (recordFailure()) scheduleGame(play, 450); return;
        }
        input.push(index);
        if (input.length === sequence.length) {
          recordCorrect(); round++; setGameProgress('Rounds: ' + round + ' / 5');
          if (round === 5) scheduleGame(completeActiveGame, 350);
          else { sequence.push(Math.floor(Math.random() * 4)); scheduleGame(play, 500); }
        }
      }
      play();
    }

    function startMonsterGame(game) {
      prepareGame(game, 'Shadows: 0 / 3');
      const monsters = [
        { shadow: '🐉', clue: 'Scaled wings, a hoarded vault, and a ruinous breath.', answer: 'Dragon', options: ['Dragon','Manticore','Wyvern','Basilisk'] },
        { shadow: '🕷', clue: 'Eight silent legs and webs across forgotten halls.', answer: 'Giant Spider', options: ['Carrion Crawler','Giant Spider','Hook Horror','Stirge'] },
        { shadow: '🧰', clue: 'It waits among treasure and bites the hand that opens it.', answer: 'Mimic', options: ['Mimic','Roper','Otyugh','Rust Monster'] },
      ];
      let round = 0;
      function renderMonster() {
        gameBoard.innerHTML = '';
        const shadow = document.createElement('div'); shadow.className = 'monster-shadow'; shadow.textContent = monsters[round].shadow; gameBoard.appendChild(shadow);
        addPrompt(monsters[round].clue);
        const options = document.createElement('div'); options.className = 'game-options';
        shuffle([...monsters[round].options]).forEach(option => options.appendChild(addChoice(option, button => {
          if (option !== monsters[round].answer) { button.classList.add('wrong'); button.disabled = true; recordFailure(); return; }
          button.classList.add('correct'); recordCorrect(); round++; setGameProgress('Shadows: ' + round + ' / 3');
          if (round === monsters.length) scheduleGame(completeActiveGame, 350); else scheduleGame(renderMonster, 350);
        })));
        gameBoard.appendChild(options);
      }
      renderMonster();
    }

    function startPotionGame(game) {
      prepareGame(game, 'Potions: 0 / 3');
      const recipes = [
        {
          name: 'Moonward Tonic',
          order: ['Silverleaf','Moon Salt','Spring Water'],
          ingredients: ['Moon Salt','Silverleaf','Spring Water','Dragon Pepper','Ash Bloom'],
          clues: [
            'Use neither the ingredient born of flame nor the flower left by flame.',
            'The leaf must enter immediately before the mineral.',
            'The ingredient found in every river seals the mixture.',
          ],
        },
        {
          name: 'Emberguard Draught',
          order: ['Ash Bloom','Dragon Pepper','Obsidian Dust'],
          ingredients: ['Dragon Pepper','Ash Bloom','Obsidian Dust','Glass Moss','Whisper Oil'],
          clues: [
            'Reject what grows on glass and what carries a whisper.',
            'The remnant of fire awakens the brew first.',
            'The volcanic stone follows the ingredient with a bite.',
          ],
        },
        {
          name: 'Veilstep Elixir',
          order: ['Glass Moss','Mist Petal','Whisper Oil'],
          ingredients: ['Mist Petal','Glass Moss','Whisper Oil','Moon Salt','Obsidian Dust'],
          clues: [
            'No mineral may enter this subtle elixir.',
            'What clings to a window begins the transformation.',
            'The petal is added before the ingredient that can be heard but not seen.',
          ],
        },
      ];
      let round = 0;
      function renderRecipe() {
        gameBoard.innerHTML = '';
        gameBoard.className = 'mode-potion';
        const recipe = recipes[round];
        addPrompt('Brew ' + recipe.name + '. Deduce three ingredients and their order:\n' + recipe.clues.map((clue, index) => (index + 1) + '. ' + clue).join('\n'));
        const slots = document.createElement('div'); slots.className = 'recipe-slots';
        slots.textContent = 'The cauldron is empty.';
        gameBoard.appendChild(slots);
        const selected = [];
        const row = document.createElement('div'); row.className = 'ingredient-row';
        shuffle([...recipe.ingredients]).forEach(ingredient => row.appendChild(addChoice(ingredient, button => {
          if (selected.includes(ingredient) || selected.length === 3) return;
          selected.push(ingredient);
          button.classList.add('selected');
          button.disabled = true;
          slots.textContent = selected.map((value, index) => (index + 1) + '. ' + value).join('  →  ');
        }, 'ingredient-key')));
        gameBoard.appendChild(row);
        const actions = document.createElement('div'); actions.className = 'potion-actions';
        actions.appendChild(addChoice('Empty Cauldron', () => {
          selected.length = 0;
          slots.textContent = 'The cauldron is empty.';
          row.querySelectorAll('button').forEach(button => {
            button.classList.remove('selected');
            button.disabled = false;
          });
        }, 'game-command'));
        actions.appendChild(addChoice('Brew Potion', () => {
          if (selected.length !== 3 || !selected.every((value, index) => value === recipe.order[index])) {
            recordFailure();
            selected.length = 0;
            slots.textContent = 'The mixture curdles. The cauldron is empty.';
            row.querySelectorAll('button').forEach(button => {
              button.classList.remove('selected');
              button.disabled = false;
            });
            return;
          }
          recordCorrect(); round++; setGameProgress('Potions: ' + round + ' / 3');
          if (round === recipes.length) scheduleGame(completeActiveGame, 350); else scheduleGame(renderRecipe, 350);
        }, 'game-command'));
        gameBoard.appendChild(actions);
      }
      renderRecipe();
    }

    function highlightSchool(school) {
      sideBlocks.forEach(b => {
        b.classList.remove('active','dim');
        if (school) {
          if (b.dataset.school === school) b.classList.add('active');
          else b.classList.add('dim');
        }
      });
    }
    function clearSchoolHighlight() {
      sideBlocks.forEach(b => b.classList.remove('active','dim'));
    }

    function setAccentColor(color) {
      COLOR_CLASSES.forEach(c => document.body.classList.remove(c));
      if (color) document.body.classList.add('color-' + color);
    }

    // ===== Markdown rendering (minimal) =====
    function escHtml(s) {
      return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
    }
    function renderInline(s) {
      return s
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }
    function renderMarkdown(md) {
      const lines = md.split(/\r?\n/);
      const out = [];
      let inList = false;
      const closeList = () => { if (inList) { out.push('</ul>'); inList = false; } };
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) { closeList(); continue; }
        let m;
        if ((m = line.match(/^### (.+)/))) { closeList(); out.push('<h3>' + renderInline(escHtml(m[1])) + '</h3>'); continue; }
        if ((m = line.match(/^## (.+)/)))  { closeList(); out.push('<h2>' + renderInline(escHtml(m[1])) + '</h2>'); continue; }
        if ((m = line.match(/^# (.+)/)))   { closeList(); out.push('<h1>' + renderInline(escHtml(m[1])) + '</h1>'); continue; }
        if ((m = line.match(/^[-*]\s+(.+)/))) {
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push('<li>' + renderInline(escHtml(m[1])) + '</li>');
          continue;
        }
        out.push('<p>' + renderInline(escHtml(line)) + '</p>');
      }
      closeList();
      return out.join('\n');
    }

    async function loadPage(school, location) {
      try {
        const res = await fetch('/api/page/' + school + '/' + location, { cache: 'no-store' });
        if (!res.ok) throw new Error('http ' + res.status);
        let md = await res.text();
        // Extract leading `<!-- font: NAME -->` marker and apply it to the page.
        let pageFont = null;
        const m = md.match(/^\s*<!--\s*font:\s*([\w.-]+)\s*-->\s*\r?\n?/i);
        if (m) { pageFont = m[1]; md = md.slice(m[0].length); }
        const pc = document.getElementById('page-content');
        if (pc) pc.style.fontFamily = pageFont
          ? ("'" + pageFont.replace(/'/g, "\\'") + "', 'Cinzel', 'Cinzel Decorative', serif")
          : '';
        showPageView(renderMarkdown(md));
      } catch (e) {
        showPageView('<h1>Lost in the Weave</h1><p>The page could not be retrieved.</p>');
      }
    }

    // ===== Cross button handlers =====
    document.querySelectorAll('.cross-btn').forEach(btn => {
      const fire = (e) => {
        e.preventDefault();
        if (currentView !== 'cross' || !currentSchool) return;
        playOrbSelect();
        const loc = btn.dataset.loc;
        loadPage(currentSchool, loc);
      };
      btn.addEventListener('click', fire);
      btn.addEventListener('touchend', fire);
    });

    document.getElementById('game-launch').addEventListener('click', () => {
      const game = SCHOOL_GAMES[currentSchool];
      if (currentView !== 'cross' || !crystalActive || gameCompleted || !game) return;
      playOrbSelect();
      startSchoolGame();
    });
    document.getElementById('game-result-action').addEventListener('click', () => {
      cleanupActiveGame();
      if (crystalActive) showCrossView();
      else showLandingView();
    });
    document.getElementById('game-close').addEventListener('click', () => {
      cleanupActiveGame();
      if (crystalActive) showCrossView();
      else showLandingView();
    });

    // ===== Page close =====
    function handlePageClose(e) {
      e.preventDefault();
      playOrbSelect();
      if (crystalActive) showCrossView();
      else               showLandingView();
    }
    pageClose.addEventListener('click',    handlePageClose);
    pageClose.addEventListener('touchend', handlePageClose);

    // ===== Exit =====
    function handleExit(e) {
      e.stopPropagation(); e.preventDefault();
      fetch('/exit', { method: 'POST' }).finally(() => window.close());
    }
    document.getElementById('exit-btn').addEventListener('click', handleExit);
    document.getElementById('exit-btn').addEventListener('touchend', handleExit);

    // Prevent rubber-band scroll on touch except inside page scroll area
    document.addEventListener('touchmove', (e) => {
      if (pageView.classList.contains('show') && pageScroll.contains(e.target)) return;
      e.preventDefault();
    }, { passive: false });

    // ===== WebSocket =====
    let ws, reconnectTimer;
    function connect() {
      ws = new WebSocket('ws://' + location.host);

      ws.onopen = () => { console.log('Connected'); clearTimeout(reconnectTimer); };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'crystal') {
          const sameInsertion = Boolean(currentInsertionId && currentInsertionId === data.insertionId);
          if (!sameInsertion) cleanupActiveGame();
          crystalActive = true;
          currentInsertionId = data.insertionId || null;
          currentSchool = data.school || null;
          currentColor  = data.color  || null;
          currentGameId = data.gameId || SCHOOL_GAMES[currentSchool]?.id || null;
          gameCompleted = data.gameCompleted === true || data.glyphPrizeClaimed === true;
          setAccentColor(currentColor);
          if (!sameInsertion) playCrystalChime();
          if (gameCompleted && data.prize) {
            setTimeout(() => showPrizePage(data.prize), 400);
          } else if (!sameInsertion || !['cross','page','game'].includes(currentView)) {
            setTimeout(() => showCrossView(), 400);
          }

        } else if (data.type === 'removed') {
          cleanupActiveGame();
          crystalActive = false;
          gameCompleted = false;
          currentInsertionId = null;
          currentGameId = null;
          currentSchool = null;
          currentColor  = null;
          setAccentColor(null);
          clearSchoolHighlight();
          showLandingView();

        } else if (data.type === 'reload') {
          location.reload();
        }
      };

      ws.onclose = () => { console.log('Disconnected'); reconnectTimer = setTimeout(connect, 2000); };
      ws.onerror = () => ws.close();
    }
    // Stay on the landing page until an inserted crystal selects a school.
    document.body.classList.add('active');
    showLandingView();
    connect();

    // Auto-register every font dropped into src/public/fonts/ (in addition to the
    // static @font-face rules above) so GM-selected fonts work without code changes.
    (async () => {
      try {
        const res = await fetch('/api/fonts', { cache: 'no-store' });
        if (!res.ok) return;
        const fonts = await res.json();
        const css = fonts.map(f =>
          "@font-face { font-family: '" + f.name + "'; font-display: swap; " +
          "src: url('" + f.file + "') format('" + f.format + "'); }"
        ).join('\n');
        const style = document.createElement('style');
        style.setAttribute('data-fonts', 'auto');
        style.textContent = css;
        document.head.appendChild(style);
      } catch (_) { /* fonts list is best-effort */ }
    })();
  </script>
</body>
